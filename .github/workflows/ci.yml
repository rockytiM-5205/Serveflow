name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: serveflow
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: serveflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serveflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_ENV: development
      DJANGO_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret
      POSTGRES_DB: serveflow
      POSTGRES_USER: serveflow
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/development.txt
      - run: ruff check .
      - run: python manage.py check
      # Fails if a model change has no committed migration.
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
